# Local Supabase configuration for Echoes.
# `supabase start` boots Postgres, Auth, Storage and the Edge runtime.
project_id = "echoes"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
# Catches every outbound auth email locally: http://localhost:54324
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "12MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "20s"

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
